        function appendNode(nodeKey) {
            const node = storyData[nodeKey];
            const storyLog = document.getElementById('story-log');

            const card = document.createElement('div');
            card.className = 'item-path';

            const paragraph = document.createElement('p');
            paragraph.innerHTML = node.text;
            card.appendChild(paragraph);

            if (node.cipher) {
                const cipherDiv = document.createElement('div');
                cipherDiv.className = 'cipher-block';
                cipherDiv.innerText = node.cipher;
                card.appendChild(cipherDiv);
            }

            const choiceContainer = document.createElement('div');
            choiceContainer.className = 'choice-container';

            if (node.options && node.options.length > 0) {
                // Render branching choice buttons
                node.options.forEach(option => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.innerText = `${option.pathLabel}: ${option.text}`;

                    btn.onclick = () => {
                        const siblingButtons = choiceContainer.querySelectorAll('.choice-btn');
                        siblingButtons.forEach(b => b.disabled = true);

                        btn.classList.add('chosen');
                        btn.innerText = `[Chosen Path ${option.pathLabel}] ${option.text}`;

                        appendNode(option.target);
                    };

                    choiceContainer.appendChild(btn);
                });
            } else {
                // Ending node reached: render configured end buttons
                const endActions = document.createElement('div');
                endActions.className = 'end-actions';

                // Fallback to restart if no custom endButtons are defined
                const buttonsToRender = node.endButtons || [
                    { label: "Start Over", action: "restart" }
                ];

                ////the auto redirect part
                let autoRedirectTimer;
                const redirectDelay = 21000; // 21 seconds

                // Auto-redirect based on action type
                const restartBtn = buttonsToRender.find(btn => btn.action === "restart" || btn.action === "rewind");
                if (restartBtn) {
                    autoRedirectTimer = setTimeout(() => {
                        if (restartBtn.action === "restart") {
                            window.location.href = "passages/denialPassage.html";
                        } else if (restartBtn.action === "rewind") {
                            storyLog.innerHTML = '';
                            appendNode('landing');
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        }
                    }, redirectDelay);
                }

                buttonsToRender.forEach(btnConfig => {
                    const btn = document.createElement('button');
                    btn.className = 'end-btn';
                    btn.innerText = btnConfig.label;

                    btn.onclick = () => {
                        // Clear auto-redirect timer when user clicks
                        if (autoRedirectTimer) {
                            clearTimeout(autoRedirectTimer);
                        }

                        if (btnConfig.action === "restart") {
                            window.location.href = "passages/denialPassage.html";
                        } else if (btnConfig.action === "rewind") {
                            storyLog.innerHTML = '';
                            appendNode('landing');
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        } else if (btnConfig.action === "redirect") {
                            window.location.href = btnConfig.target;
                        }
                    };

                    endActions.appendChild(btn);
                });

                ////maybe until here

                choiceContainer.appendChild(endActions);
            }

            card.appendChild(choiceContainer);
            storyLog.appendChild(card);

            card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
