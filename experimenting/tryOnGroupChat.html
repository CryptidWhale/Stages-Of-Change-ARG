<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group Chat Simulation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Chat App Window */
    .chat-container {
      width: 100%;
      max-width: 420px;
      height: 600px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    /* Header */
    .chat-header {
      background: #0f172a;
      padding: 16px;
      border-bottom: 1px solid #334155;
      text-align: center;
    }

    .chat-header h2 {
      font-size: 1.1rem;
      color: #38bdf8;
    }

    .chat-header p {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    /* Scrollable Chat Feed */
    .chat-feed {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Individual Chat Bubble Group */
    .chat-message {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(10px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .chat-message.left {
      align-self: flex-start;
    }

    .chat-message.right {
      align-self: flex-end;
    }

    .sender-name {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 4px;
      margin-left: 4px;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .left .bubble {
      background: #334155;
      color: #f1f5f9;
      border-bottom-left-radius: 2px;
    }

    .right .bubble {
      background: #0284c7;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    /* Typing Indicator Animation */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 16px;
      background: #334155;
      border-radius: 14px;
      border-bottom-left-radius: 2px;
      width: fit-content;
      align-self: flex-start;
      margin-bottom: 8px;
      animation: popIn 0.2s ease-out;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background: #94a3b8;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) { animation-delay: 0s; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <h2>D&D Campaign Planning 🐉</h2>
      <p id="status-text">Simulation running...</p>
    </div>

    <div class="chat-feed" id="chat-feed">
      </div>
  </div>

  <script>
    // 1. Scripted Conversation Sequence
    // isUser: true renders the bubble on the right side
    const script = [
      { sender: "Sarah (DM)", text: "Hey party! Are we still good for Friday night session?", delayBeforeTyping: 1000, typingTime: 1500 },
      { sender: "Alex (Rogue)", text: "Count me in. My daggers are ready 🗡️", delayBeforeTyping: 1200, typingTime: 1200 },
      { sender: "You", text: "I need to prepare my spell slots first, but I'll be there!", isUser: true, delayBeforeTyping: 1500, typingTime: 2000 },
      { sender: "Sarah (DM)", text: "Awesome! Make sure you guys level up to level 4 before arriving.", delayBeforeTyping: 1000, typingTime: 1800 },
      { sender: "Alex (Rogue)", text: "Wait... did we survive that dragon attack last session?! 🐉", delayBeforeTyping: 1400, typingTime: 2200 },
      { sender: "You", text: "Barely! The Bard saved us with a Nat 20 roll.", isUser: true, delayBeforeTyping: 1200, typingTime: 1500 }
    ];

    const chatFeed = document.getElementById('chat-feed');
    const statusText = document.getElementById('status-text');

    // Utility helper to pause execution using Async/Await Promises
    const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // Render Typing Indicator Bubbles
    function showTypingIndicator(sender, isUser) {
      const wrapper = document.createElement('div');
      wrapper.id = 'active-typing';
      wrapper.className = `chat-message ${isUser ? 'right' : 'left'}`;

      if (!isUser) {
        const nameEl = document.createElement('div');
        nameEl.className = 'sender-name';
        nameEl.innerText = `${sender} is typing...`;
        wrapper.appendChild(nameEl);
      }

      const indicator = document.createElement('div');
      indicator.className = 'typing-indicator';
      indicator.innerHTML = `
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      `;
      
      wrapper.appendChild(indicator);
      chatFeed.appendChild(wrapper);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const activeTyping = document.getElementById('active-typing');
      if (activeTyping) activeTyping.remove();
    }

    // Render Final Message Bubble
    function appendMessage(sender, text, isUser) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `chat-message ${isUser ? 'right' : 'left'}`;

      if (!isUser) {
        const nameEl = document.createElement('div');
        nameEl.className = 'sender-name';
        nameEl.innerText = sender;
        msgDiv.appendChild(nameEl);
      }

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerText = text;

      msgDiv.appendChild(bubble);
      chatFeed.appendChild(msgDiv);
      scrollToBottom();
    }

    function scrollToBottom() {
      chatFeed.scrollTop = chatFeed.scrollHeight;
    }

    // Main Async Loop to run the pre-scripted video-like timing sequence
    async function startSimulation() {
      for (const msg of script) {
        // Pause before the character starts typing
        await wait(msg.delayBeforeTyping);

        // Show typing indicator animation
        showTypingIndicator(msg.sender, msg.isUser);

        // Simulate length of time spent typing
        await wait(msg.typingTime);

        // Remove indicator & show the text bubble
        removeTypingIndicator();
        appendMessage(msg.sender, msg.text, msg.isUser);
      }

      statusText.innerText = "Simulation finished";
    }

    // Run on load
    startSimulation();
  </script>

</body>
</html>
