<!-- trying some accessories (with moving stuffs) -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7 Stages Carousel Prototype</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background-color: #0d0d11;
      color: #ffffff;
      overflow-x: hidden;
      padding-top: 20px;
    }

    .header-container {
      text-align: center;
      width: 100%;
      max-width: 800px;
      padding: 0 20px;
      margin-bottom: 15px;
    }

    .sub-title {
      font-size: 1rem;
      color: #aaa;
      margin-bottom: 4px;
    }

    .main-title {
      font-size: clamp(2rem, 8vw, 4.5rem);
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      z-index: 20;
    }

    .btn {
      background-color: #22222a;
      color: #ffffff;
      border: 1px solid #444455;
      padding: 8px 20px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background-color: #333344;
      border-color: #666688;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .carousel-wrapper {
      position: relative;
      width: 100vw;
      height: calc(100vh - 180px);
      display: flex;
      justify-content: center;
    }

    .arc-line, .wheel {
      position: absolute;
      width: min(85vw, 900px);
      height: min(85vw, 900px);
      top: 90px;
      border-radius: 50%;
    }

    .arc-line {
      border: 3px dashed rgba(255, 255, 255, 0.25);
      pointer-events: none;
    }

    .wheel {
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Base 3D Orb Styling */
    .node {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(18vw, 130px);
      height: min(18vw, 130px);
      margin-top: calc(min(18vw, 130px) / -2);
      margin-left: calc(min(18vw, 130px) / -2);
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s ease;
      
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, rgba(255,255,255,0.6) 18%, var(--node-color) 60%, #000000 100%);
      box-shadow: 
        inset -4px -4px 10px rgba(0, 0, 0, 0.6),
        inset 4px 4px 10px rgba(255, 255, 255, 0.8),
        0 4px 15px rgba(0, 0, 0, 0.5);
    }

    /* Base active glow */
    .node.active {
      box-shadow: 
        inset -4px -4px 10px rgba(0, 0, 0, 0.4),
        inset 4px 4px 12px rgba(255, 255, 255, 0.9),
        0 0 30px var(--node-color),
        0 0 60px var(--node-color);
    }

    /* ==========================================
       STAGE-SPECIFIC ACTIVE EFFECTS
    ========================================== */

    /* STAGE 1: Orbiting Satellite Orb */
    .node.active[data-stage="0"]::before {
      content: '';
      position: absolute;
      top: -15px; left: -15px; right: -15px; bottom: -15px;
      border-radius: 50%;
      border: 2px dashed rgba(255, 255, 255, 0.3);
      animation: rotateOrbit 3s linear infinite;
    }
    .node.active[data-stage="0"]::after {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      background: #ffffff;
      border-radius: 50%;
      top: -8px; left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 15px #ffffff, 0 0 25px var(--node-color);
      animation: rotateOrbit 3s linear infinite;
      transform-origin: 50% calc(min(9vw, 65px) + 8px);
    }
    @keyframes rotateOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* STAGE 2: Rotating Sparkle Ring */
    .node.active[data-stage="1"]::before {
      content: '';
      position: absolute;
      top: -20px; left: -20px; right: -20px; bottom: -20px;
      border-radius: 50%;
      border: 3px dotted var(--node-color);
      box-shadow: 0 0 20px var(--node-color);
      animation: sparkRotate 1.8s linear infinite;
    }
    .node.active[data-stage="1"]::after {
      content: '✦';
      position: absolute;
      color: #fff;
      font-size: 1.5rem;
      top: -15px; right: -5px;
      text-shadow: 0 0 10px var(--node-color);
      animation: sparkFlash 0.6s alternate infinite ease-in-out;
    }
    @keyframes sparkRotate {
      from { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.08); }
      to { transform: rotate(360deg) scale(1); }
    }
    @keyframes sparkFlash {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.4); }
    }

    /* STAGE 3: Glitch Effect (Fixed positioning issue) */
    .node.active[data-stage="2"]::before,
    .node.active[data-stage="2"]::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 50%;
      background: inherit;
      pointer-events: none;
    }
    .node.active[data-stage="2"]::before {
      box-shadow: -4px 0 #ff0055, 4px 0 #00ffff;
      opacity: 0.7;
      animation: glitchLayer 0.25s infinite alternate steps(2);
    }
    .node.active[data-stage="2"]::after {
      box-shadow: inset 0 0 15px #ffdc53;
      animation: glitchJitter 0.18s infinite alternate ease-in-out;
    }

    @keyframes glitchLayer {
      0% { transform: translate(-3px, 2px); clip-path: inset(10% 0 20% 0); }
      50% { transform: translate(3px, -2px); clip-path: inset(30% 0 10% 0); }
      100% { transform: translate(-1px, 3px); clip-path: inset(5% 0 40% 0); }
    }
    @keyframes glitchJitter {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.9; transform: scale(1.04); }
    }

    /* STAGE 4: Ethereal Ripple Shockwave */
    .node.active[data-stage="3"]::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 50%;
      border: 2px solid var(--node-color);
      animation: rippleWave 1.8s infinite cubic-bezier(0, 0.2, 0.8, 1);
    }
    @keyframes rippleWave {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    /* STAGE 5: Swirling Plasma Shield */
    .node.active[data-stage="4"]::before {
      content: '';
      position: absolute;
      top: -12px; left: -12px; right: -12px; bottom: -12px;
      border-radius: 40% 50% 45% 55%;
      background: linear-gradient(45deg, transparent, var(--node-color), #ffffff);
      opacity: 0.7;
      filter: blur(8px);
      animation: plasmaSwirl 2s linear infinite;
      z-index: -1;
    }
    @keyframes plasmaSwirl {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* STAGE 6: Twinkling Starburst Particles */
    .node.active[data-stage="5"]::before {
      content: '✨';
      position: absolute;
      top: -20px; left: -10px;
      font-size: 1.4rem;
      animation: particleFloat 1.2s ease-in-out infinite alternate;
    }
    .node.active[data-stage="5"]::after {
      content: '✨';
      position: absolute;
      bottom: -15px; right: -10px;
      font-size: 1.2rem;
      animation: particleFloat 1.5s ease-in-out infinite alternate-reverse;
    }
    @keyframes particleFloat {
      0% { transform: translateY(0) scale(0.7); opacity: 0.3; }
      100% { transform: translateY(-12px) scale(1.3); opacity: 1; }
    }

    /* STAGE 7: Solar Flare Pulse */
    .node.active[data-stage="6"]::before {
      content: '';
      position: absolute;
      top: -15px; left: -15px; right: -15px; bottom: -15px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--node-color) 0%, transparent 70%);
      animation: solarPulse 1s ease-in-out infinite alternate;
      z-index: -1;
    }
    @keyframes solarPulse {
      0% { transform: scale(1); opacity: 0.4; }
      100% { transform: scale(1.4); opacity: 0.9; }
    }

    /* Toast notification */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%) translateY(12px);
      background: rgba(20, 20, 30, 0.95);
      border: 1px solid #444;
      color: #fff;
      padding: 12px 18px;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
      opacity: 0;
      transition: opacity 250ms ease, transform 250ms ease;
      z-index: 9999;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (min-width: 768px) {
      .header-container {
        text-align: left;
        padding-left: 120px;
      }
      .sub-title {
        font-size: 1.2rem;
      }
      .btn {
        padding: 10px 28px;
        font-size: 1.1rem;
      }
      .arc-line, .wheel {
        top: 130px;
      }
    }
  </style>
</head>

<body>

  <div class="header-container">
    <p class="sub-title">the stage of</p>
    <h1 class="main-title" id="stageTitle">FIRST STAGE</h1>
  </div>

  <div class="controls">
    <button class="btn" id="prevBtn">&lt;</button>
    <button class="btn" id="enterBtn">enter</button>
    <button class="btn" id="randomBtn">Random</button>
    <button class="btn" id="nextBtn">&gt;</button>
  </div>

  <div class="carousel-wrapper">
    <div class="arc-line"></div>
    <div class="wheel" id="wheel"></div>
  </div>

  <script>
    const stages = [
      { name: "FIRST STAGE", color: "#ff3b30", circleUrl: "stage1-circle.html", enterUrl: "stage1-enter.html" },
      { name: "SECOND STAGE", color: "#a8ff53", circleUrl: "stage2-circle.html", enterUrl: "stage2-enter.html" },
      { name: "THIRD STAGE", color: "#ffdc53", circleUrl: "stage3-circle.html", enterUrl: "stage3-enter.html" },
      { name: "FOURTH STAGE", color: "#3a65ff", circleUrl: "stage4-circle.html", enterUrl: "stage4-enter.html" },
      { name: "FIFTH STAGE", color: "#d06aff", circleUrl: "stage5-circle.html", enterUrl: "stage5-enter.html" },
      { name: "SIXTH STAGE", color: "#53e2f3", circleUrl: "stage6-circle.html", enterUrl: "stage6-enter.html" },
      { name: "SEVENTH STAGE", color: "#ff9500", circleUrl: "stage7-circle.html", enterUrl: "stage7-enter.html" }
    ];

    const total = stages.length;
    let currentStep = 0;

    const stageTitle = document.getElementById('stageTitle');
    const wheel = document.getElementById('wheel');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const enterBtn = document.getElementById('enterBtn');
    const randomBtn = document.getElementById('randomBtn');

    let isRedirecting = false;

    function showToast(message, duration = 3000) {
      let toast = document.getElementById('globalToast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'globalToast';
        toast.className = 'toast';
        document.body.appendChild(toast);
      }
      toast.textContent = message;
      toast.classList.add('show');
      if (toast._hideTimer) clearTimeout(toast._hideTimer);
      toast._hideTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, duration);
    }

    function createNodes() {
      wheel.innerHTML = ''; 
      const radius = wheel.offsetWidth / 2;

      stages.forEach((stage, index) => {
        const node = document.createElement('div');
        node.className = 'node';
        node.dataset.stage = index;
        node.style.setProperty('--node-color', stage.color);

        const angleDeg = (index * (360 / total)) - 90;
        const angleRad = (angleDeg * Math.PI) / 180;

        const x = radius * Math.cos(angleRad);
        const y = radius * Math.sin(angleRad);

        node.dataset.x = x;
        node.dataset.y = y;

        node.addEventListener('click', () => {
          const activeIndex = ((currentStep % total) + total) % total;
          if (index === activeIndex) {
            window.location.href = stages[index].circleUrl;
          } else {
            goToStage(index);
          }
        });

        wheel.appendChild(node);
      });
      updateCarousel();
    }

    function updateCarousel() {
      const targetAngle = -(currentStep * (360 / total));
      wheel.style.transform = `rotate(${targetAngle}deg)`;

      const activeIndex = ((currentStep % total) + total) % total;

      const nodes = wheel.querySelectorAll('.node');
      nodes.forEach((node, index) => {
        const x = parseFloat(node.dataset.x);
        const y = parseFloat(node.dataset.y);

        if (index === activeIndex) {
          node.classList.add('active');
          node.style.transform = `translate(${x}px, ${y}px) rotate(${-targetAngle}deg) scale(1.35)`;
          node.style.zIndex = "10";
        } else {
          node.classList.remove('active');
          node.style.transform = `translate(${x}px, ${y}px) rotate(${-targetAngle}deg) scale(0.85)`;
          node.style.zIndex = "1";
        }
      });

      stageTitle.textContent = stages[activeIndex].name;
    }

    function goToStage(targetIndex) {
      const activeIndex = ((currentStep % total) + total) % total;
      let diff = targetIndex - activeIndex;

      if (diff > total / 2) diff -= total;
      if (diff < -total / 2) diff += total;

      currentStep += diff;
      updateCarousel();
    }

    enterBtn.addEventListener('click', () => {
      const activeIndex = ((currentStep % total) + total) % total;
      window.location.href = stages[activeIndex].enterUrl;
    });

    prevBtn.addEventListener('click', () => {
      currentStep--;
      updateCarousel();
    });

    nextBtn.addEventListener('click', () => {
      currentStep++;
      updateCarousel();
    });

    randomBtn.addEventListener('click', () => {
      const activeIndex = ((currentStep % total) + total) % total;
      let rand;
      do {
        rand = Math.floor(Math.random() * total);
      } while (rand === activeIndex);

      goToStage(rand);
    });

    document.addEventListener('keydown', (event) => {
      if (['ArrowLeft', 'ArrowRight'].includes(event.key)) {
        event.preventDefault();
      }

      switch (event.key) {
        case 'ArrowLeft':
          prevBtn.click();
          break;
        case 'ArrowRight':
          nextBtn.click();
          break;
        case 'q':
        case 'Q':
          if (isRedirecting) break;
          isRedirecting = true;
          showToast("whoops, hang on tight!!!", 3000);
          setTimeout(() => {
            window.location.href = "secret-room.html";
          }, 3000);
          break;
        case 'Enter':
          enterBtn.click();
          break;
      }
    });

    window.addEventListener('resize', createNodes);
    createNodes();
  </script>
</body>

</html>
