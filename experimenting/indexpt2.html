<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>7 Stages Radial Carousel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #111111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
      user-select: none;
    }

    /* Top Stage Heading */
    .header-section {
      text-align: center;
      margin-top: 5rem;
      z-index: 10;
    }

    .sub-title {
      font-size: 1.25rem;
      font-weight: 400;
      color: #222222;
      margin-bottom: 0.5rem;
      letter-spacing: 0.5px;
    }

    .stage-title {
      font-size: 4rem;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .stage-title.fade-out {
      opacity: 0;
      transform: translateY(-8px);
    }

    /* Controls Bar */
    .controls {
      display: flex;
      gap: 1.25rem;
      margin-top: 2.5rem;
      z-index: 10;
    }

    .btn {
      background-color: #6b6b6b;
      color: #ffffff;
      border: none;
      outline: none;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 10px;
      padding: 0.75rem 1.75rem;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background-color: #555555;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-arrow {
      padding: 0.75rem 1.25rem;
      font-weight: bold;
    }

    /* Wheel & Arc Viewport */
    .carousel-stage {
      position: absolute;
      bottom: -320px;
      left: 50%;
      transform: translateX(-50%);
      width: 760px;
      height: 760px;
    }

    .wheel-track {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 6px solid #b3b3b3;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      transform-origin: center center;
    }

    /* Stage Nodes */
    .node-slot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
    }

    .node {
      position: absolute;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      cursor: pointer;
      transform: translate(-50%, -50%) scale(1);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
    }

    .node:hover {
      filter: brightness(1.05);
    }

    .node.active {
      width: 135px;
      height: 135px;
      transform: translate(-50%, -50%) scale(1.1);
      z-index: 5;
    }
  </style>
</head>
<body>

  <main class="header-section">
    <p class="sub-title">the stage of</p>
    <h1 class="stage-title" id="stageTitle">FIRST STAGE</h1>

    <div class="controls">
      <button class="btn btn-arrow" id="prevBtn" aria-label="Previous Stage">&lt;</button>
      <button class="btn" id="enterBtn">enter</button>
      <button class="btn" id="randomBtn">Random</button>
      <button class="btn btn-arrow" id="nextBtn" aria-label="Next Stage">&gt;</button>
    </div>
  </main>

  <div class="carousel-stage">
    <div class="wheel-track" id="wheelTrack"></div>
  </div>

  <script>
    const stages = [
      { id: 1, name: "FIRST STAGE", color: "#ff3b30" },
      { id: 2, name: "SECOND STAGE", color: "#b4f057" },
      { id: 3, name: "THIRD STAGE", color: "#ffd24c" },
      { id: 4, name: "FOURTH STAGE", color: "#1900a4" },
      { id: 5, name: "FIFTH STAGE", color: "#8324cf" },
      { id: 6, name: "SIXTH STAGE", color: "#d946ef" },
      { id: 7, name: "SEVENTH STAGE", color: "#4de2e6" }
    ];

    const totalStages = stages.length;
    const anglePerStage = 360 / totalStages;
    const radius = 380; // Distance from circle center to node center

    let activeStepIndex = 0; // Represents the visual rotation offset
    const wheelTrack = document.getElementById("wheelTrack");
    const stageTitle = document.getElementById("stageTitle");

    // Initialize the 7 stage bubbles evenly along the 360-degree perimeter
    function initCarousel() {
      stages.forEach((stage, index) => {
        const slot = document.createElement("div");
        slot.className = "node-slot";

        // -90 degrees anchors index 0 precisely at the top (12 o'clock)
        const angleDeg = -90 + (index * anglePerStage);
        const angleRad = (angleDeg * Math.PI) / 180;

        const x = radius * Math.cos(angleRad);
        const y = radius * Math.sin(angleRad);

        const node = document.createElement("div");
        node.className = `node ${index === 0 ? "active" : ""}`;
        node.style.backgroundColor = stage.color;
        node.style.left = `${x}px`;
        node.style.top = `${y}px`;
        node.dataset.index = index;

        node.addEventListener("click", () => {
          goToStage(index);
        });

        slot.appendChild(node);
        wheelTrack.appendChild(slot);
      });
    }

    // Update wheel rotation, bubble sizes, and smooth title transitions
    function updateCarousel() {
      // Rotate counter-clockwise to bring following stages up
      const targetAngle = -activeStepIndex * anglePerStage;
      wheelTrack.style.transform = `rotate(${targetAngle}deg)`;

      // Resolve infinite modulo index for stage lookup
      const resolvedIndex = ((activeStepIndex % totalStages) + totalStages) % totalStages;

      // Update active bubble scaling
      const allNodes = document.querySelectorAll(".node");
      allNodes.forEach((node) => {
        const nodeIndex = parseInt(node.dataset.index, 10);
        if (nodeIndex === resolvedIndex) {
          node.classList.add("active");
        } else {
          node.classList.remove("active");
        }
      });

      // Text swap transition
      stageTitle.classList.add("fade-out");
      setTimeout(() => {
        stageTitle.textContent = stages[resolvedIndex].name;
        stageTitle.classList.remove("fade-out");
      }, 200);
    }

    function rotateNext() {
      activeStepIndex++;
      updateCarousel();
    }

    function rotatePrev() {
      activeStepIndex--;
      updateCarousel();
    }

    function goToStage(targetIndex) {
      const currentIndex = ((activeStepIndex % totalStages) + totalStages) % totalStages;
      let diff = targetIndex - currentIndex;

      // Calculate shortest rotational path
      if (diff > totalStages / 2) diff -= totalStages;
      if (diff < -totalStages / 2) diff += totalStages;

      activeStepIndex += diff;
      updateCarousel();
    }

    function pickRandom() {
      let randomIndex;
      const currentIndex = ((activeStepIndex % totalStages) + totalStages) % totalStages;
      do {
        randomIndex = Math.floor(Math.random() * totalStages);
      } while (randomIndex === currentIndex);

      goToStage(randomIndex);
    }

    // Event Bindings
    // In your prototype wireframe, clicking "<" pulls the next stage (Stage 2) into the center view
    document.getElementById("prevBtn").addEventListener("click", rotateNext);
    document.getElementById("nextBtn").addEventListener("click", rotatePrev);
    document.getElementById("randomBtn").addEventListener("click", pickRandom);
    document.getElementById("enterBtn").addEventListener("click", () => {
      const resolvedIndex = ((activeStepIndex % totalStages) + totalStages) % totalStages;
      alert(`Entering: ${stages[resolvedIndex].name}`);
    });

    // Keyboard Arrow Navigation
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") rotateNext();
      if (e.key === "ArrowRight") rotatePrev();
    });

    initCarousel();
  </script>
</body>
</html>
