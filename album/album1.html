             mungkin fi yes, bagi something good. if no, redirect ke youtube video. kalau diorang spam. marah and keluar error page, then redirect ke next stage -->

    <script>
        const track = document.getElementById('imageTrack');
        const originalSlides = Array.from(track.children);
        const totalOriginal = originalSlides.length;

        // 1. Clone first and last slides for seamless infinite loop
        const firstClone = originalSlides[0].cloneNode(true);
        const lastClone = originalSlides[totalOriginal - 1].cloneNode(true);

        firstClone.id = 'first-clone';
        lastClone.id = 'last-clone';

        track.appendChild(firstClone);
        track.insertBefore(lastClone, originalSlides[0]);

        const allSlides = Array.from(track.children);

        let currentIndex = 1;
        let isTransitioning = false;
        let autoPlayTimer;

        // 2. FIX: Disable transition during initial placement & force browser reflow
        track.style.transition = 'none';
        track.style.transform = `translateX(-${currentIndex * 100}%)`;
        void track.offsetWidth; // Forces the browser to apply placement instantly without animation

        function moveCarousel(direction) {
            if (isTransitioning) return;
            isTransitioning = true;

            currentIndex += direction;
            track.style.transition = 'transform 0.4s ease-in-out';
            track.style.transform = `translateX(-${currentIndex * 100}%)`;

            resetAutoPlay();
        }

        // 3. Silent reset when reaching clones
        track.addEventListener('transitionend', () => {
            isTransitioning = false;

            if (allSlides[currentIndex].id === 'first-clone') {
                track.style.transition = 'none';
                currentIndex = 1;
                track.style.transform = `translateX(-${currentIndex * 100}%)`;
            }

            if (allSlides[currentIndex].id === 'last-clone') {
                track.style.transition = 'none';
                currentIndex = totalOriginal;
                track.style.transform = `translateX(-${currentIndex * 100}%)`;
            }
        });

        function resetAutoPlay() {
            clearInterval(autoPlayTimer);
            autoPlayTimer = setInterval(function () {
                moveCarousel(1);
            }, 3000);
        }

        // Start autoplay loop normally after clean positioning
        resetAutoPlay();
    </script>
</body>
